<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Reading in 1 Year</title>
<meta name="theme-color" content="#8C1A39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bible Reading">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout idea: one-screen phone app. Wine-colored title band on top, scrolling content in the middle,
   four tabs pinned to the bottom within thumb reach. The Bible drawn as a strip with a ribbon bookmark. */
:root{
  --accent:#9A1F3F;        /* wine for text, borders, icons */
  --band:#8C1A39;          /* wine fill behind white text */
  --soft:#F8E6EC;          /* highlighted rows */
  --ink:#24181D;
  --muted:#6F6067;
  --paper:#FBF7F8;
  --card:#FFFFFF;
  --line:#EEDBE2;
  --good:#22704A;
  --good-soft:#E1F0E7;
  --warn:#9A4A06;
  --warn-soft:#FBEEDB;
  --display:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --body:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#F08AA6; --band:#7A1733; --soft:#3A1F29; --ink:#F6ECEF; --muted:#C3AFB7;
    --paper:#140E11; --card:#20171B; --line:#3A2830; --good:#63C78F; --good-soft:#173020; --warn:#F2AD57; --warn-soft:#3B2A12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --accent:#F08AA6; --band:#7A1733; --soft:#3A1F29; --ink:#F6ECEF; --muted:#C3AFB7;
  --paper:#140E11; --card:#20171B; --line:#3A2830; --good:#63C78F; --good-soft:#173020; --warn:#F2AD57; --warn-soft:#3B2A12;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- guided tour */
.tour{position:fixed;inset:0;z-index:60}
.tour[hidden]{display:none}
.tour-spot{position:fixed;border-radius:14px;pointer-events:none;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--band),0 0 0 200vmax rgba(18,8,12,.62);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.tour-spot.none{box-shadow:0 0 0 200vmax rgba(18,8,12,.62)}
.tour-card{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,420px);background:var(--card);color:var(--ink);border-radius:16px;padding:16px 16px 12px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.tour-card.at-top{top:calc(env(safe-area-inset-top) + 14px)}
.tour-card.at-bottom{bottom:calc(env(safe-area-inset-bottom) + 86px)}
.tour-card.at-middle{top:50%;transform:translate(-50%,-50%)}
.tour-step{margin:0;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.tour-card h2{margin:4px 0 6px;font:600 21px/1.25 var(--display);text-wrap:balance}
.tour-card p.tour-text{margin:0;font-size:16px;line-height:1.45}
.tour-dots{display:flex;gap:5px;margin-top:12px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--band)}
.tour-btns{display:flex;align-items:center;gap:8px;margin-top:12px}
.tour-btns .skip{margin-right:auto;border:0;background:none;color:var(--muted);font-weight:600;padding:10px 4px;min-height:44px}
.tour-btns .btn{min-height:44px;padding:10px 18px}

/* ---------- top band */
.top{flex:none;background:var(--band);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto}
.top .row1{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.95}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9}
.status[data-s="local"] i{background:#FFD54F}
.status[data-s="saving"] i{opacity:.5}
h1{font:600 clamp(22px,6vw,28px)/1.15 var(--display);margin:4px 0 10px;text-wrap:balance;letter-spacing:.2px}
.row3{display:flex;gap:10px;align-items:center;justify-content:space-between}
.behind{display:inline-flex;align-items:center;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;letter-spacing:.2px}
.editbtn{border:1.5px solid rgba(255,255,255,.8);background:transparent;color:#fff;border-radius:999px;padding:7px 16px;font-weight:600;min-height:38px}
.editbtn[aria-pressed="true"]{background:#fff;color:var(--band);border-color:#fff}

/* ---------- content */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font:600 19px/1.25 var(--display);margin:0 0 8px;text-wrap:balance}
.card p{margin:0 0 8px}
.hint{color:var(--muted);font-size:14px}
.editnote{background:var(--soft);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;font-size:14px}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;margin:12px 16px 0}
.err[hidden]{display:none}

/* day chips */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:58px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:7px 8px 6px;text-align:center;line-height:1.1}
.chip b{display:block;font-size:15px}
.chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.today{border-color:var(--accent)}
.chip.alldone small{color:var(--good);font-weight:700}
.chip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:#fff}
.chip[aria-pressed="true"] small{color:#fff;opacity:.9}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dayhead h2{margin:0;font:600 24px/1.2 var(--display)}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 9px;vertical-align:middle}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 2px}
.progress > div{height:100%;background:var(--band)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.statusline{margin-top:8px;font-size:15px}
.statusline b{color:var(--warn)}
.statusline b.ok{color:var(--good)}

.slot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.slot > h3{margin:0;background:var(--band);color:#fff;font:700 14px/1 var(--body);letter-spacing:.6px;text-transform:uppercase;padding:9px 14px;text-align:center}
.slot > h3 small{font-weight:600;opacity:.85;letter-spacing:.3px}
ul.items{list-style:none;margin:0;padding:4px 0}
.item{padding:2px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.main{background:var(--soft);border-left:4px solid var(--band)}
.check{display:flex;align-items:center;gap:12px;min-height:50px;cursor:pointer;padding:4px 0}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:26px;height:26px;border:2px solid var(--accent);border-radius:8px;display:grid;place-items:center;background:var(--card)}
.check input:checked + .box{background:var(--band);border-color:var(--band)}
.check input:checked + .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.t{font:500 18px/1.25 var(--display)}
.check input:checked ~ .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.when{margin-left:auto;text-align:right;font-size:13px;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.when b{display:block;color:var(--ink);font-size:14px}
.item.main .when b{color:var(--accent)}
.tag{display:block;margin:-6px 0 6px 38px;font-size:12px;font-weight:600;color:var(--accent)}
.tag a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.plandesc{margin:6px 0 0;font-size:14px;color:var(--muted)}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--good-soft);border-radius:12px;padding:10px 12px;margin:8px 0}
.privacy svg{flex:none;width:22px;height:22px;color:var(--good);margin-top:1px}
.privacy p{margin:0;font-size:15px;line-height:1.45;color:var(--ink)}
.srcs{margin:6px 0 0;padding-left:18px;font-size:14px}
.srcs li{margin:4px 0}
.srcs a{color:var(--accent)}
.empty{padding:14px;margin:0;text-align:center}
.done-note{margin:4px 12px 10px;padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:700;text-align:center}

/* edit mode rows */
.erow{display:flex;gap:8px;align-items:center;padding:6px 0}
.txt{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;font-size:16px}
.icon{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.icon svg{width:18px;height:18px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;padding:4px 12px 12px}
.chb{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chb.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chb.tday{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bookwhen{margin:8px 12px 2px;font-size:13px;color:var(--muted)}
.paceq{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.add{display:block;width:calc(100% - 24px);margin:8px 12px 10px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:10px;font-weight:600}

/* forms */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
textarea{resize:vertical;min-height:96px}
.notearea{display:block;width:calc(100% - 24px);margin:10px 12px 12px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;min-height:90px;resize:vertical}

/* Bible strip */
.strip{margin:6px 0 2px}
.srow{position:relative;height:18px;font-size:12px;font-weight:700}
.srow.above{margin-bottom:12px}
.srow.below{margin-top:12px}
.slabel{position:absolute;top:0;white-space:nowrap}
.slabel.you{color:var(--accent)}
.slabel.sched{color:var(--muted)}
.bar{position:relative;height:14px;border-radius:4px;background:var(--line)}
.bar .fill{position:absolute;top:0;bottom:0;left:0;background:var(--ink);border-radius:4px 0 0 4px}
.bar .gap{position:absolute;top:0;bottom:0;background-color:var(--soft);background-image:repeating-linear-gradient(135deg,var(--accent) 0 2px,transparent 2px 7px);opacity:.6}
.bar .nt{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--muted)}
.bar .now{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink)}
.bar .ribbon{position:absolute;top:-9px;width:14px;height:32px;margin-left:-7px;background:var(--band);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ends{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stats div{font-size:12px;color:var(--muted)}
.stats b{display:block;margin-top:2px;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:700;border:1.5px solid var(--band);background:var(--band);color:#fff;text-decoration:none;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .full{grid-column:1/-1}
ol.steps{margin:6px 0 0;padding-left:20px}
ol.steps li{margin:4px 0}
.dnote{padding:10px 0;border-bottom:1px solid var(--line)}
.dnote:last-child{border-bottom:0}
.dnote button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:14px}
.dnote p{margin:4px 0 0;white-space:pre-wrap}
.msgline{font-size:14px;font-weight:600;color:var(--good);margin:8px 0 0}
.msgline.bad{color:var(--warn)}

/* bottom tabs */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:4px max(6px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 4px) max(6px, env(safe-area-inset-left))}
nav.tabs button{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;color:var(--muted);font-size:12px;font-weight:600;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center;z-index:5}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row1"><span>Your Bible reading</span><span class="status" id="status" data-s="local" role="status"><i></i><span id="statusText">Saved on this phone</span></span></div>
    <h1 id="apptitle">Bible Reading in 1 Year</h1>
    <div class="row3">
      <span class="behind" id="behind">Bible reading</span>
      <button class="editbtn" id="editBtn" type="button" aria-pressed="false" data-act="edit">Edit</button>
    </div>
  </div>
</header>
<p class="err" id="err" role="alert" hidden></p>
<main id="main"><div class="wrap stack" id="view"><div class="card"><h2>Bible Reading in 1 Year</h2><p>One reading a day from Genesis to Revelation, with 2 a day to catch up when you fall behind.</p><p class="hint" style="margin:0">If the app doesn’t appear in a moment, close this page and open it again in Safari or Chrome.</p></div></div></main>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>Today</button>
  <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>Plan</button>
  <button type="button" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h10l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-14a1 1 0 0 1 1-1z"/><path d="M8 11h8M8 15h6"/></svg>Notes</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>More</button>
</nav>
<div class="toast" id="toast" hidden></div>
<div class="tour" id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
  <div class="tour-spot none" id="tour-spot"></div>
  <div class="tour-card at-middle" id="tour-card">
    <p class="tour-step" id="tour-step"></p>
    <h2 id="tour-title"></h2>
    <p class="tour-text" id="tour-text"></p>
    <div class="tour-dots" id="tour-dots" aria-hidden="true"></div>
    <div class="tour-btns">
      <button type="button" class="skip" data-tour="skip">Skip tour</button>
      <button type="button" class="btn ghost" data-tour="back">Back</button>
      <button type="button" class="btn" data-tour="next" id="tour-next">Next</button>
    </div>
  </div>
</div>

<script>
window.addEventListener("error", function (e) {
  var b = document.getElementById("err");
  if (b) { b.hidden = false; b.textContent = "Something went wrong: " + (e && e.message ? e.message : "unknown error") + ". Try closing and reopening the page."; }
});
</script>
<script id="logic">
/* Pure date and catch-up logic. Days are whole-day numbers (days since 1970-01-01). */
var DAY_MS = 86400000;
function dayOf(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); }
function parseISO(s) { var p = s.split("-").map(Number); return dayOf(p[0], p[1], p[2]); }
function isoOf(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }
/* Same rule for any plan: days[j] is the scheduled day of the j-th reading (in order). While behind, the next
   `pace` unread readings go on each day; once caught up, each reading on its scheduled day. */
function computePlanDays(days, done, T, pace) {
  var n = days.length, todayISO = isoOf(T);
  var pool = [], checkedToday = [], doneCount = 0, behind = 0, dueStart = 0;
  for (var i = 0; i < n; i++) {
    var d = done[i];
    if (d === undefined) { pool.push(i); if (days[i] < T) behind++; }
    else { doneCount++; if (d === todayISO) checkedToday.push(i); }
    if (days[i] <= T && (d === undefined || d === todayISO)) dueStart++;
  }
  var target = Math.min(pace, dueStart), planned = new Map(), todayList = checkedToday.slice(), p = 0;
  var need = Math.max(0, target - checkedToday.length);
  for (var k = 0; k < need && p < pool.length; k++) { planned.set(pool[p], T); todayList.push(pool[p]); p++; }
  todayList.sort(function (a, b) { return a - b; });
  var caughtUp = (p >= pool.length || days[pool[p]] > T) ? T : null, day = T;
  while (p < pool.length) {
    day++;
    if (days[pool[p]] > day) day = days[pool[p]];
    var take = 0;
    while (take < pace && p + take < pool.length && days[pool[p + take]] <= day) take++;
    for (var t = 0; t < take; t++) { planned.set(pool[p], day); p++; }
    if (caughtUp === null && (p >= pool.length || days[pool[p]] > day)) caughtUp = day;
  }
  return { pool: pool, planned: planned, todayList: todayList, caughtUp: caughtUp, behind: behind,
           doneCount: doneCount, target: target, finish: pool.length ? day : null };
}
/* Reading i is scheduled for startDay + i. While behind, the next `pace` unread readings go on each day;
   once caught up, one a day on its scheduled date. done: {index: "-" | "YYYY-MM-DD"}. */
function computePlan(n, startDay, done, T, pace) {
  var todayISO = isoOf(T);
  var sched = function (i) { return startDay + i; };
  var pool = [], checkedToday = [], doneCount = 0, behind = 0, dueStart = 0;
  for (var i = 0; i < n; i++) {
    var d = done[i];
    if (d === undefined) { pool.push(i); if (sched(i) < T) behind++; }
    else { doneCount++; if (d === todayISO) checkedToday.push(i); }
    if (sched(i) <= T && (d === undefined || d === todayISO)) dueStart++;
  }
  var target = Math.min(pace, dueStart);
  var planned = new Map();
  var todayList = checkedToday.slice();
  var p = 0;
  var need = Math.max(0, target - checkedToday.length);
  for (var k = 0; k < need && p < pool.length; k++) { planned.set(pool[p], T); todayList.push(pool[p]); p++; }

(function(){
  const chIds = (bk, a, z) => { const b = bookNo(bk), o = []; for(let k=a; k<=z; k++) o.push("c"+b+"."+k); return o; };
  PLAN.readings.forEach((r,i)=>{
    const lab = PLAN.books[r[0]];
    if(COMBINED[lab]){ const all = []; COMBINED[lab].forEach((bk,k)=>{ const ids = chIds(bk, 1, chCount(bk)); SETCH.set("r"+i+"."+k, ids); all.push.apply(all, ids); }); SETCH.set("r"+i, all); return; }
    const parts = String(r[1] || "").split("\u2013"), a = parseInt(parts[0], 10) || 1;
    const z = !r[1] ? chCount(lab) : parts.length < 2 ? a : (parts[0].indexOf(":") >= 0 && parts[1].indexOf(":") < 0) ? a : (parseInt(parts[1], 10) || a);
    SETCH.set("r"+i, chIds(lab, a, z));
  });
  SETCH.forEach((chs, id)=> chs.forEach(c=>{ if(!CONTAINS.has(c)) CONTAINS.set(c, []); CONTAINS.get(c).push(id); }));
})();
const chapterMode = (st) => (st || S).readings.some(x => CONTAINS.has(x.id));
function addMonths(dn, m){ const d = new Date(dn * DAY_MS); return dayOf(d.getUTCFullYear(), d.getUTCMonth() + 1 + m, d.getUTCDate()); }

// Days after the start date on which each reading is scheduled
function offsets(){
  const p = S.plan, n = S.readings.length, off = new Array(n);
  if(p.kind !== "week"){ for(let i=0;i<n;i++) off[i] = i * p.pace; return off; }
  const wd0 = (((parseISO(S.start) + 4) % 7) + 7) % 7;      // 1970-01-01 was a Thursday
  const count = {};
  S.readings.forEach((x,i)=>{ const w = weekSection(split(x.t).book), k = count[w] || 0; count[w] = k + 1;
    off[i] = ((WEEK[w].day - wd0 + 7) % 7) + 7 * k; });
  return off;
}
// Read a chapter on wol.jw.org (New World Translation)
function wolUrl(t){
  const sp = split(t), n = bookNo(firstBook(sp.book)); if(!n) return "";
  const m = /\d+/.exec(sp.ch || ""), ch = m ? m[0] : "1";
  return "https://wol.jw.org/en/wol/b/r1/lp-e/nwtsty/" + n + "/" + ch;
}

function makeDefault(){
  const today = new Date(); const todayISO = isoOf(dayOf(today.getFullYear(), today.getMonth()+1, today.getDate()));
  return { v:2, updatedAt:0, setup:false, tourSeen:false, start:todayISO, notes:"", dayNotes:{}, plan:{ kind:"year", theme:"", mode:"standard", perDay:1, months:12, pace:1 },
    readings: PLAN.readings.map((r,i)=>({ id:"r"+i, t:label0(i), done:"" })) };
}

// ---------------------------------------------------------------- state
const clone = (o) => JSON.parse(JSON.stringify(o));
function normalize(s){
  const d = makeDefault();
  if(!s || typeof s !== "object") return d;
  if(typeof s.start !== "string" || !ISO.test(s.start)) s.start = d.start;
  if(!Array.isArray(s.readings) || !s.readings.length) s.readings = d.readings;
  s.readings = s.readings.filter(x => x && typeof x === "object")
    .map(x => ({ id: String(x.id || uid()), t: String(x.t == null ? "" : x.t), done: okDone(x.done) ? x.done : "" }));
  if(typeof s.notes !== "string") s.notes = "";
  if(!s.archive || typeof s.archive !== "object" || Array.isArray(s.archive)) s.archive = {};
  if(!s.dayNotes || typeof s.dayNotes !== "object" || Array.isArray(s.dayNotes)) s.dayNotes = {};
  if(typeof s.setup !== "boolean") s.setup = true;     // anything saved before this option existed was already set up
  if(typeof s.tourSeen !== "boolean") s.tourSeen = false;
  s.plan = normSpec(s.plan);                          // older saves: the standard schedule
  const chap = s.readings.length > 0 && s.readings.every(x => CONTAINS.has(x.id));
  if(isFlexSpec(s.plan) && !chap) s.plan.mode = "standard";
  else if(!isFlexSpec(s.plan) && chap){ s.plan.mode = "chapters"; if(s.plan.kind === "week") s.plan.kind = "year"; }
  s.v = 2; s.updatedAt = Number(s.updatedAt) || 0;
  return s;
}
function readLocal(){
  try{
    const r = localStorage.getItem(LS_KEY);
    if(r) return JSON.parse(r);
    const old = localStorage.getItem(OLD_KEY);
    if(old){
      const o = JSON.parse(old), s = makeDefault();
      if(o && o.done && typeof o.done === "object") s.readings.forEach((x,i)=>{ x.done = okDone(o.done[i]) ? o.done[i] : ""; });
      if(o && typeof o.start === "string" && ISO.test(o.start)) s.start = o.start;
      s.updatedAt = Number(o && o.updated) || 0;
      return s;
    }
  }catch(e){}
  return null;
}
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

let S = normalize(readLocal());
(function applyPersonalLink(){

  let q = null; try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const st = q && q.get("start"); if(!st || !ISO.test(st)) return;
  let k = parseInt(q.get("next") || "1", 10); if(!(k >= 1)) k = 1; k = Math.min(k - 1, S.readings.length);
  S.start = st; S.readings.forEach((x,i)=>{ x.done = i < k ? "-" : ""; });
  S.setup = true; S.updatedAt = Date.now(); writeLocal();
})();
const ui = { tab:"today", day:null, edit:false, confirm:null, planScrolled:false, placeSel:null, more:0, moreDay:null, mSpec:null, wPlace:0 };

const getP = (p) => p.split(".").reduce((o,k)=> o == null ? o : o[k], S);
function setP(p, v){ const ks = p.split("."); let o = S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length-1]] = v; }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fid = (p) => "f-" + p.replace(/\./g,"-");
function todayNum(){ const t = new Date(); return dayOf(t.getFullYear(), t.getMonth()+1, t.getDate()); }
const yearOf = (n) => new Date(n * DAY_MS).getUTCFullYear();
function fmt(n, o){
  o = o || {};
  const opt = { timeZone:"UTC", month: o.long ? "long" : "short", day:"numeric" };
  if(o.weekday !== false) opt.weekday = o.long ? "long" : "short";
  if(o.year || yearOf(n) !== yearOf(todayNum())) opt.year = "numeric";
  return new Date(n * DAY_MS).toLocaleDateString("en-US", opt);
}
// "2 Kings 4–5" → book "2 Kings", chapters "4–5"
const BOOKS_BY_LEN = Array.from(new Set(PLAN.books.concat(BOOK66))).sort((x,y)=>y.length-x.length);
function split(t){
  const s = String(t).trim();
  const known = BOOKS_BY_LEN.find(bk => s === bk || s.indexOf(bk + " ") === 0);   // starts with a book name from the plan
  if(known) return { book:known, ch:s.slice(known.length).trim() };
  const m = /^(.+?)\s+(\d.*)$/.exec(s);
  return m ? { book:m[1], ch:m[2] } : { book:s, ch:"" };
}

// ---------------------------------------------------------------- the plan, worked out from the state
let P = null;
function plan(){
  if(isFlexSpec(S.plan)) return planFlex();
  const T = todayNum(), startDay = parseISO(S.start), n = S.readings.length;
  const off = offsets();
  const order = S.readings.map((_,i)=>i).sort((a,b)=> off[a]-off[b] || a-b);
  const days = order.map(i => startDay + off[i]);
  const r = computePlanDays(days, order.map(i => S.readings[i].done || undefined), T, PACE);
  const c = { T, startDay, order, rank:new Array(n), caughtUp:r.caughtUp, behind:r.behind, doneCount:r.doneCount, target:r.target, finish:r.finish };
  order.forEach((i,j)=>{ c.rank[i] = j; });
  c.sched = (i) => startDay + off[i];
  c.pool = r.pool.map(j => order[j]);
  c.planned = new Map(); r.planned.forEach((d,j)=> c.planned.set(order[j], d));
  c.todayList = r.todayList.map(j => order[j]);
  c.firstUnread = r.pool.length ? order[r.pool[0]] : n;
  c.youPos = r.pool.length ? r.pool[0] : n;
  c.schedPos = days.filter(d => d < T).length;
  c.lastDay = n ? days[n-1] : startDay;
  c.byDay = new Map();
  c.planned.forEach((d,i)=>{ if(!c.byDay.has(d)) c.byDay.set(d, []); c.byDay.get(d).push(i); });
  c.byDay.forEach(list => list.sort((a,b)=>c.rank[a]-c.rank[b]));
  c.readOn = new Map();
  S.readings.forEach((x,i)=>{ if(x.done && x.done !== "-"){ const d = parseISO(x.done); if(!c.readOn.has(d)) c.readOn.set(d, []); c.readOn.get(d).push(i); } });
  P = c;
  return c;
}
// Chapter by chapter at your own pace: never behind. Today has the day's chapters (plus any extra you ask for);
// the chapters left are spread over the days ahead at your pace, so reading more or less moves the finish date.
function planFlex(){
  const T = todayNum(), startDay = parseISO(S.start), n = S.readings.length, todayISO = isoOf(T), sp = S.plan;
  const order = S.readings.map((_,i)=>i), pool = [], checkedToday = []; let doneCount = 0;
  S.readings.forEach((x,i)=>{ if(!x.done) pool.push(i); else { doneCount++; if(x.done === todayISO) checkedToday.push(i); } });
  const started = T >= startDay, base = Math.max(T, startDay);
  let r = sp.perDay, endBy = null, late = false;
  if(sp.mode === "finish"){
    endBy = addMonths(startDay, sp.months) - 1;
    const left = endBy - base + 1;
    if(left < 1){ late = true; r = Math.max(n / Math.max(1, endBy - startDay + 1), 1e-3); }
    else r = Math.max((pool.length + (started ? checkedToday.length : 0)) / left, 1e-3);
  }
  const planned = new Map(), todayList = checkedToday.slice(), extra = started && ui.moreDay === T ? ui.more : 0;
  let p = 0;
  const put = (d) => { planned.set(pool[p], d); if(d === T) todayList.push(pool[p]); p++; };
  if(r >= 1 - 1e-9){
    const amt = (d) => Math.ceil((d - base + 1) * r - 1e-9) - Math.ceil((d - base) * r - 1e-9);
    let day = base;
    if(started){ const need = Math.max(0, amt(T) + extra - checkedToday.length); for(let k=0; k<need && p<pool.length; k++) put(T); day = T + 1; }
    while(p < pool.length){ const a = amt(day); for(let k=0; k<a && p<pool.length; k++) put(day); day++; }
  } else {                                           // a chapter every few days: take your time, a few verses a day
    const per = 1 / r;
    let from = startDay;
    if(started){ const need = Math.max(0, 1 + extra - checkedToday.length); for(let k=0; k<need && p<pool.length; k++) put(T);
      from = checkedToday.length || extra ? T + 1 : T + per; }
    for(let k=0; p<pool.length; k++) put(Math.floor(from + k * per + 1e-9));
  }
  let finish = null; planned.forEach(d=>{ if(finish === null || d > finish) finish = d; });
  const c = { T, startDay, order, rank:order.slice(), flex:true, rate:r, endBy, late, caughtUp:T, behind:0, doneCount, target:0,
    finish: pool.length ? finish : null };
  c.sched = (i) => planned.has(i) ? planned.get(i) : (S.readings[i].done && S.readings[i].done !== "-" ? parseISO(S.readings[i].done) : T);
  c.pool = pool; c.planned = planned; c.todayList = todayList.sort((a,b)=>a-b);
  c.firstUnread = pool.length ? pool[0] : n; c.youPos = c.firstUnread; c.schedPos = c.youPos;
  c.lastDay = finish == null ? T : finish;
  c.byDay = new Map();
  planned.forEach((d,i)=>{ if(!c.byDay.has(d)) c.byDay.set(d, []); c.byDay.get(d).push(i); });
  c.byDay.forEach(list => list.sort((a,b)=>a-b));
  c.readOn = new Map();
  S.readings.forEach((x,i)=>{ if(x.done && x.done !== "-"){ const d = parseISO(x.done); if(!c.readOn.has(d)) c.readOn.set(d, []); c.readOn.get(d).push(i); } });
  P = c;
  return c;
}
// Work out a plan for a changed copy of the state, without touching the real one
function previewPlan(mut){
  const s0 = S, p0 = P; S = clone(S);
  try{ mut(); return plan(); } finally { S = s0; P = p0; }
}
const unit = (n) => (S.plan.kind === "week" || S.plan.pace > 1 ? " reading" : " day") + (n === 1 ? "" : "s");
function dayItems(c, d){
  if(d === c.T) return c.todayList;
  if(d < c.T) return (c.readOn.get(d) || []).slice().sort((a,b)=>c.rank[a]-c.rank[b]);
  return c.byDay.get(d) || [];
}

// ---------------------------------------------------------------- saving: only on this device (private, no account, no internet)
const cloud = { ref:null, ok:false, writing:false, retried:false };
let dirty = false, saveTimer = null, needsRender = false, pendingRemote = null;

function setStatus(s){
  const el = document.getElementById("status"), tx = document.getElementById("statusText");
  el.dataset.s = s;
  tx.textContent = { saving:"Saving…", saved:"Saved", local:"Saved on this phone", connecting:"Connecting…", stale:"Saved here · can't reach the cloud yet" }[s] || s;
}
function save(){
  S.updatedAt = Date.now();
  writeLocal();
  dirty = true;
  if(cloud.ok) setStatus("saving"); else { setStatus("local"); dirty = false; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 800);
}
async function flush(){
  if(!dirty || !cloud.ok) return;
  if(cloud.writing){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); return; }
  cloud.writing = true; dirty = false;
  try{
    await cloud.ref.set({ v:2, updatedAt:S.updatedAt, state:clone(S) });
    cloud.retried = false;
    setStatus(dirty ? "saving" : "saved");
  }catch(e){
    if(e && e.code === "unavailable" && !cloud.retried){
      cloud.retried = true; dirty = true;
      setTimeout(flush, 1200 + Math.random()*1200);
    } else {
      cloud.ok = false; setStatus("local");
    }
  }finally{
    cloud.writing = false;
    if(dirty && cloud.ok){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); }
  }
}
// ---------------------------------------------------------------- rendering
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function checkRow(c, i, o){
  const x = S.readings[i], isDone = !!x.done, sched = c.sched(i);
  if(ui.edit){
    return `<li class="item"><div class="erow"><input class="txt" id="${fid("readings."+i+".t")}" data-path="readings.${i}.t" value="${esc(x.t)}" aria-label="Reading">
      ${o.del ? `<button type="button" class="icon" data-act="del" data-i="${i}" aria-label="Delete ${esc(x.t)}">${ICON_X}</button>` : ""}</div></li>`;
  }
  const text = o.short ? (split(x.t).ch || x.t) : x.t;
  let when = "";
  if(o.dates){
    if(isDone) when = `<span class="when"><b>Read</b>${x.done !== "-" ? esc(fmt(parseISO(x.done),{weekday:false})) : ""}</span>`;
    else { const pd = c.planned.get(i); when = `<span class="when"><b>${esc(fmt(pd))}</b>${pd !== sched ? "Sched. " + esc(fmt(sched,{weekday:false})) : ""}</span>`; }
  }
  return `<li class="item ${o.main?"main":""}" ${o.anchor?`id="r${i}"`:""}>
    <label class="check"><input type="checkbox" id="${fid((o.anchor?"p":"d")+".r"+i)}" data-tick="${i}" ${isDone?"checked":""}><span class="box"></span><span class="t">${o.short?`<span class="sr">${esc(split(x.t).book)} </span>`:""}${esc(text)}</span>${when}</label>
    ${o.sub || o.read ? `<span class="tag">${o.sub ? esc(o.sub) : ""}${o.read && wolUrl(x.t) ? `${o.sub ? " · " : ""}<a href="${wolUrl(x.t)}" target="_blank" rel="noopener">Read on wol.jw.org</a>` : ""}</span>` : ""}</li>`;
}

function stripHTML(c){
  const N = S.readings.length, O = c.order, flex = !!c.flex;
  if(!N) return "";
  const youPct = c.youPos / N * 100;
  const sIdx = Math.max(0, Math.min(N, c.schedPos));
  const sPct = sIdx / N * 100;
  const ntPos = S.plan.kind === "year" ? O.findIndex(i => /^Matthew\b/.test(S.readings[i].t)) : -1;
  const place = (pct) => pct < 18 ? "translateX(-7px)" : pct > 82 ? "translateX(calc(-100% + 7px))" : "translateX(-50%)";
  const youTxt = c.pool.length ? "You’re in " + split(S.readings[c.firstUnread].t).book : "Finished";
  const sTxt = sIdx >= N ? "Schedule: finished" : "Schedule: " + split(S.readings[O[sIdx]].t).book;
  const first = split(S.readings[O[0]].t).book, last = split(S.readings[O[N-1]].t).book;

      ${ntPos > 0 ? `<div class="nt" style="left:${ntPos/N*100}%"></div>` : ""}
      ${flex ? "" : `<div class="now" style="left:${sPct}%"></div>`}
      ${c.pool.length ? `<div class="ribbon" style="left:${youPct}%"></div>` : ""}</div>
    ${flex ? "" : `<div class="srow below"><span class="slabel sched" style="left:${sPct}%;transform:${place(sPct)}">${esc(sTxt)}</span></div>`}
    <div class="ends"><span>${esc(first)}</span><span>${esc(last)}</span></div></div>`;
}

function statusText(c){
  if(!c.pool.length) return `<b class="ok">Finished!</b> You’ve read ${S.plan.kind === "theme" ? "this whole plan" : "the whole Bible"}.`;
  if(c.T < c.startDay) return `<b class="ok">Your plan starts ${esc(fmt(c.startDay))}.</b> First reading: ${esc(S.readings[c.firstUnread].t)}.`;
  if(c.flex){                                        // your own pace: never behind, only a finish date that moves with you
    const fin = esc(fmt(c.finish, {year:true}));
    if(S.plan.mode === "finish") return c.late ? `<b>Your finish-by date has passed.</b> Choose a new length below. At ${esc(rateText(c.rate))} you’ll finish ${fin}.`
      : `<b class="ok">${esc(cap(rateText(c.rate)))}</b> to finish by ${esc(fmt(c.endBy, {year:true}))}.`;
    return `<b class="ok">${esc(cap(rateText(c.rate)))}.</b> At this pace you’ll finish ${fin} (${esc(howLong(c.finish - c.T + 1))}).`;
  }
  if(c.behind > 0) return c.caughtUp === c.T ? `<b>${c.behind}${unit(c.behind)} behind.</b> Finish today’s reading and you’re caught up.`
    : `<b>${c.behind}${unit(c.behind)} behind.</b> At 2 a day you’ll be caught up ${esc(fmt(c.caughtUp))}.`;
  const ahead = c.sched(c.firstUnread) - c.T - 1;
  return ahead >= 1 && S.plan.kind !== "week" && S.plan.pace === 1 ? `<b class="ok">${ahead} day${ahead===1?"":"s"} ahead.</b> Nice work.` : `<b class="ok">On schedule.</b>`;
}

function renderPlanFlex(c){
  const today = new Set(c.todayList), groups = [];
  S.readings.forEach((x,i)=>{ const bk = split(x.t).book, g = groups[groups.length-1]; if(g && g.key === bk) g.idx.push(i); else groups.push({ key:bk, idx:[i] }); });
  const secs = groups.map(g=>{
    const done = g.idx.filter(i=>S.readings[i].done).length;
    const ds = g.idx.filter(i=>!S.readings[i].done).map(i=>c.planned.get(i)).filter(d=>d != null);
    const lo = ds.length ? Math.min.apply(null, ds) : null, hi = ds.length ? Math.max.apply(null, ds) : null;
    const when = lo == null ? (done ? "All read" : "") : lo === hi ? fmt(lo) : fmt(lo,{weekday:false}) + " – " + fmt(hi,{weekday:false});
    return `<section class="slot"><h3>${esc(g.key)} <small>· ${done} of ${g.idx.length}</small></h3>${when ? `<p class="bookwhen">${esc(when)}</p>` : ""}
      <div class="chgrid">${g.idx.map(i=>{ const x = S.readings[i], on = !!x.done;
        return `<button type="button" class="chb ${on?"on":""} ${today.has(i)?"tday":""}" id="r${i}" data-tickbtn="${i}" aria-pressed="${on}" aria-label="${esc(x.t)}${on?", read":""}">${esc(split(x.t).ch || x.t)}</button>`; }).join("")}</div></section>`;
  }).join("");
  return `
  <div class="card">
    <h2>${esc(planName())}</h2>
    <p class="hint">Tap a chapter number when you’ve read it. The dates show when you’ll reach each book at your pace, and they move as you read more or less.</p>

  </div>
  ${secs}`;
}
function renderPlan(c){
  if(c.flex) return renderPlanFlex(c);
  const today = new Set(c.todayList), week = S.plan.kind === "week", groups = [];
  c.order.forEach(i=>{
    const key = week ? Math.floor((c.sched(i) - c.startDay) / 7) : split(S.readings[i].t).book;
    const g = groups[groups.length-1];
    if(g && g.key === key) g.idx.push(i); else groups.push({ key, idx:[i] });
  });
  const secs = groups.map(g=>{
    const done = g.idx.filter(i=>S.readings[i].done).length;
    const title = week ? "Week " + (g.key + 1) + " · " + fmt(c.startDay + g.key * 7, {weekday:false}) : g.key;
    const last = g.idx[g.idx.length-1];
    return `<section class="slot"><h3>${esc(title)} <small>· ${done} of ${g.idx.length}</small></h3><ul class="items">
      ${g.idx.map(i=>checkRow(c, i, { short:!week, dates:true, anchor:true, main: today.has(i), del:true })).join("")}</ul>
      ${ui.edit && !week ? `<button type="button" class="add" data-act="addReading" data-after="${last}" data-book="${esc(g.key)}">+ Add a reading to ${esc(g.key)}</button>` : ""}</section>`;
  }).join("");
  return `

  </div>
  ${secs}`;
}

  document.querySelector('[data-tour="back"]').hidden = tourI === 0;
  const next = document.getElementById("tour-next");
  const lastStep = tourI === tourSteps.length - 1;
  next.textContent = lastStep ? (tourSteps === TOUR_SETUP ? "Got it" : "Done") : tourI === 0 ? "Show me" : "Next";
  tourTarget = typeof st.sel === "function" ? st.sel() : st.sel ? document.querySelector(st.sel) : null;
  if(tourTarget && tourTarget.closest("main")) tourTarget.scrollIntoView({ block:"center" });
  placeSpot(); requestAnimationFrame(placeSpot); setTimeout(placeSpot, 150);
  try{ next.focus({ preventScroll:true }); }catch(e){}
}
function placeSpot(){
  if(tourI < 0) return;
  const spot = document.getElementById("tour-spot"), card = document.getElementById("tour-card");
  const t = tourTarget && document.body.contains(tourTarget) ? tourTarget : null;
  card.classList.remove("at-top","at-bottom","at-middle");
  if(!t){ spot.classList.add("none"); spot.style.cssText = "left:50%;top:50%;width:0;height:0"; card.classList.add("at-middle"); return; }
  const r = t.getBoundingClientRect(), pad = 6;
  spot.classList.remove("none");
  spot.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad*2}px;height:${r.height + pad*2}px`;
  card.classList.add(r.top + r.height / 2 > window.innerHeight / 2 ? "at-top" : "at-bottom");
}
document.addEventListener("click", (e)=>{
  const b = e.target.closest("[data-tour]"); if(!b || tourI < 0) return;
  e.stopPropagation();
  const a = b.dataset.tour;
  if(a === "skip") return endTour(true);
  if(a === "back"){ tourI = Math.max(0, tourI - 1); return showTourStep(); }
  if(tourI >= tourSteps.length - 1) return endTour(false);
  tourI++; showTourStep();
}, true);
document.addEventListener("keydown", (e)=>{
  if(tourI < 0) return;
  if(e.key === "Escape"){ e.preventDefault(); endTour(true); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); document.getElementById("tour-next").click(); }
  else if(e.key === "ArrowLeft" && tourI > 0){ e.preventDefault(); document.querySelector('[data-tour="back"]').click(); }
  else if(e.key === "Tab"){   // keep keyboard focus inside the tour card
    const f = Array.from(document.querySelectorAll("#tour-card button")).filter(x=>!x.hidden);
    const i = f.indexOf(document.activeElement);
    if(e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
  }
});
window.addEventListener("resize", placeSpot);
document.getElementById("main").addEventListener("scroll", placeSpot, { passive:true });

function go(tab){
  ui.tab = tab; ui.confirm = null; if(tab !== "today") ui.edit = ui.edit && tab === "plan"; if(tab !== "more") ui.mSpec = null;
  if(location.hash.replace("#","") !== tab){ try{ history.replaceState(null, "", "#" + tab); }catch(e){} }
  render(); document.getElementById("main").scrollTop = 0;
  if(tab === "today") centerChip();
  if(tab === "plan" && !ui.planScrolled){ ui.planScrolled = true; jumpToday(false); }
}
function centerChip(){ setTimeout(()=>{ const ch = document.querySelector('.chip[aria-pressed="true"]'); if(ch && ch.scrollIntoView) ch.scrollIntoView({inline:"center", block:"nearest"}); }, 0); }
function jumpToday(smooth){
  const c = P || plan();
  let target = c.todayList.find(i => !S.readings[i].done);
  if(target === undefined) target = c.todayList.length ? c.todayList[0] : Math.min(c.firstUnread, S.readings.length-1);
  const el = document.getElementById("r" + target);
  if(el) el.scrollIntoView({ block:"center", behavior: smooth ? "smooth" : "auto" });
}

// backup codes: start date, notes, which readings are read, and any edited reading names
function encodeBackup(){
  const runs = []; let cur = null;
  S.readings.forEach((x,i)=>{ const v = x.done ? (x.done === "-" ? 0 : x.done) : null;
    if(v === null){ cur = null; return; }
    if(cur && cur[2] === v && cur[1] === i-1) cur[1] = i; else { cur = [i,i,v]; runs.push(cur); } });
  const def = buildReadings(S.plan), same = S.readings.length === def.length && S.readings.every((x,i)=>x.t === def[i].t && x.id === def[i].id);
  const arc = archiveNow(), a = {}, ids = new Set(S.readings.map(x=>x.id)), chap = chapterMode();
  Object.keys(arc).forEach(k=>{                     // only what can't be worked out again from the current readings
    const d = arc[k].d; if(!d || ids.has(k)) return;
    if(chap && SETCH.has(k)) return;
    if(!chap && CONTAINS.has(k)){ const L = CONTAINS.get(k).filter(id => ids.has(id)); if(L.length && L.every(id => arc[id] && arc[id].d)) return; }
    a[k] = d;
  });
  const body = { v:2, s:S.start, r:runs, n:S.notes, dn:S.dayNotes, p:S.plan, a, t: same ? null : S.readings.map(x=>x.t), i: same ? null : S.readings.map(x=>x.id) };
  return "BR2." + btoa(unescape(encodeURIComponent(JSON.stringify(body))));
}
function decodeBackup(code){
  const raw = String(code).trim(), body = raw.replace(/^BR[12]\./, "").replace(/\s+/g, "");
  const o = JSON.parse(decodeURIComponent(escape(atob(body))));
  const s = makeDefault();
  if(o.p && typeof o.p === "object") s.plan = normSpec(o.p);
  if(Array.isArray(o.t)) s.readings = o.t.map((t,i)=>({ id: Array.isArray(o.i) && o.i[i] ? String(o.i[i]) : uid(), t:String(t), done:"" }));
  else s.readings = buildReadings(s.plan);
  s.readings.forEach(x=>{ x.done = ""; });
  (o.r || []).forEach(run=>{ for(let i=run[0]; i<=run[1] && i<s.readings.length; i++) s.readings[i].done = run[2] === 0 ? "-" : run[2]; });
  if(typeof o.s === "string") s.start = o.s;
  if(typeof o.n === "string") s.notes = o.n;
  if(o.dn && typeof o.dn === "object") s.dayNotes = o.dn;
  if(o.a && typeof o.a === "object"){ s.archive = {}; Object.keys(o.a).forEach(k=>{ if(okDone(o.a[k])) s.archive[k] = { d:o.a[k], t:"" }; }); }
  s.setup = true;                                   // a restored backup is a plan already in progress
  const out = normalize(s);
  if(!out.readings.length) throw new Error("empty");
  return out;
}

// Every tick ever made is remembered by reading (S.archive), whichever plan is showing, so switching plans never loses one.
// The standard schedule's readings and single chapters are kept in step: a reading counts as read once all its chapters are.
function maxDone(ds){ let best = ""; ds.forEach(d=>{ if(!d) return; if(d === "-"){ if(!best) best = "-"; } else if(best === "" || best === "-" || d > best) best = d; }); return best; }
function archiveNow(){
  const arc = S.archive || {}, has = (k) => !!(arc[k] && arc[k].d);
  S.readings.forEach(x=>{ arc[x.id] = { d:x.done || "", t:x.t }; });
  const cur = new Set(S.readings.map(x=>x.id));
  if(chapterMode()){
    SETCH.forEach((chs, id)=>{ const ds = chs.map(c => arc[c] ? arc[c].d : ""); arc[id] = { d: ds.every(Boolean) ? maxDone(ds) : "", t:(arc[id] && arc[id].t) || "" }; });
  } else {
    PLAN.readings.forEach((r,i)=>{                       // keep a combined reading and its single books in step
      const lab = PLAN.books[r[0]]; if(!COMBINED[lab]) return;
      const base = "r" + i, parts = COMBINED[lab].map((_,k)=>base + "." + k);
      if(cur.has(base)) parts.forEach(pid => { arc[pid] = { d: arc[base].d, t: (arc[pid] && arc[pid].t) || "" }; });
      else if(parts.some(pid => cur.has(pid))){ const all = parts.every(pid => arc[pid] && arc[pid].d); arc[base] = { d: all ? maxDone(parts.map(pid => arc[pid].d)) : "", t: (arc[base] && arc[base].t) || "" }; }
    });
    const put = [];                                     // ticking a reading ticks its chapters; unticking it unticks them
    CONTAINS.forEach((sets, c)=>{
      const L = sets.filter(id => cur.has(id)); if(!L.length) return;
      const ds = L.map(id => arc[id].d);
      if(ds.every(Boolean)){ if(!has(c)) put.push([c, maxDone(ds)]); }
      else if(!ds.some(Boolean) && L.every(id => SETCH.get(id).every(has))) put.push([c, ""]);
    });
    put.forEach(q => { arc[q[0]] = { d:q[1], t:"" }; });
  }
  S.archive = arc;
  return arc;
}
function switchTo(spec){
  const arc = archiveNow(), fresh = buildReadings(spec);
  fresh.forEach(x=>{ const o = arc[x.id]; if(o){ x.done = o.d || ""; if(o.t) x.t = o.t; } });
  S.plan = spec; S.readings = fresh;
}

document.addEventListener("click", (e)=>{
  const tb = e.target.closest("nav.tabs [data-tab]");
  if(tb){ e.preventDefault(); if(tb.dataset.tab === "plan" && ui.tab === "plan") jumpToday(true); else go(tb.dataset.tab); return; }
  const tk = e.target.closest("[data-tickbtn]");
  if(tk){ const i = +tk.dataset.tickbtn, x = S.readings[i]; if(!x) return;
    x.done = x.done ? "" : isoOf(todayNum()); save(); render();
    const el = document.getElementById("r" + i); if(el){ try{ el.focus({ preventScroll:true }); }catch(err){} } return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act !== "place" && act !== "clearAll" && act !== "switchPlan") ui.confirm = null;
  switch(act){
    case "edit": ui.edit = !ui.edit; render(); return;
    case "day": ui.day = +b.dataset.d; render(); centerChip(); return;
    case "gotoDay": ui.day = +b.dataset.d; go("today"); return;
    case "jump": jumpToday(true); return;
    case "more": { const T = todayNum(); if(ui.moreDay !== T){ ui.moreDay = T; ui.more = 0; } ui.more++; render(); return; }
    case "del": { const i = +b.dataset.i; const t = S.readings[i] && S.readings[i].t;
      S.readings.splice(i,1); save(); render(); toast(`Deleted ${t}`); return; }
    case "addReading": { const after = +b.dataset.after; S.readings.splice(after+1, 0, { id:uid(), t:b.dataset.book + " ", done:"" });
      save(); render(); const inp = document.getElementById(fid("readings."+(after+1)+".t")); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } return; }
    case "place": {
      if(ui.confirm !== "place"){ ui.confirm = "place"; render(); return; }
      ui.confirm = null;
      const k = ui.placeSel == null ? +document.getElementById("f-place").value : ui.placeSel;
      ui.placeSel = null;
      const cc = P || plan();
      S.readings.forEach((x,i)=>{ if(cc.rank[i] < k){ if(!x.done) x.done = "-"; } else x.done = ""; });
      save(); render(); toast(k < S.readings.length ? `Your place: ${S.readings[cc.order[k]].t}` : "Marked the whole plan as read"); return; }
    case "switchPlan": {
      if(ui.confirm !== "switch"){ ui.confirm = "switch"; render(); return; }
      ui.confirm = null;
      switchTo(ui.mSpec || S.plan);
      ui.mSpec = null; ui.edit = false; ui.day = null; ui.placeSel = null; ui.planScrolled = false;
      save(); render();
      toast(P && P.flex && P.finish != null ? "Plan changed · finish " + fmt(P.finish, {weekday:false}) : "Plan changed"); return; }
    case "clearAll": {
      if(ui.confirm !== "clear"){ ui.confirm = "clear"; render(); return; }
      ui.confirm = null; S = makeDefault(); S.updatedAt = Date.now(); ui.day = null; ui.edit = false; save(); go("today"); toast("Starting over"); return; }
    case "begin": {
      const st = document.getElementById("w-start").value, k = +document.getElementById("w-place").value;
      if(!ISO.test(st)){ toast("Pick your start date first"); return; }
      S.start = st; const cc = plan(); S.readings.forEach((x,i)=>{ x.done = cc.rank[i] < k ? "-" : ""; }); S.setup = true; ui.day = null; ui.wPlace = 0;
      save(); go("today"); if(!S.tourSeen) setTimeout(startTour, 350); else toast("Your plan is ready"); return; }
    case "tour": startTour(); return;
    case "copyLink": {
      const url = location.origin + location.pathname;
      const fb = ()=>{ const el = document.getElementById("share-url"); if(el && window.getSelection){ const r = document.createRange(); r.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Press and hold the address, then tap Copy"); };
      try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast("Address copied"), fb); else fb(); }catch(err){ fb(); }
      return; }
    case "copyBackup": {
      const code = encodeBackup(), ta = document.getElementById("f-backup");
      if(ta) ta.value = code;
      const fallback = ()=>{ if(ta){ ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); } backupMsg = { t:"Press and hold the code above, then tap Copy.", bad:false }; showBackupMsg(); };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>{ backupMsg = { t:"Copied. Paste it into a note or a text to yourself.", bad:false }; showBackupMsg(); }, fallback);
        else fallback();
      }catch(err){ fallback(); }
      return; }
    case "restore": {
      const ta = document.getElementById("f-backup");
      try{ const s = decodeBackup(ta ? ta.value : ""); s.updatedAt = Date.now(); S = s; save(); backupMsg = { t:"Progress restored.", bad:false }; render(); toast("Progress restored"); }
      catch(err){ backupMsg = { t:"That code didn’t work. Copy the whole code, starting with BR, and try again.", bad:true }; showBackupMsg(); }
      return; }
  }
});
function showBackupMsg(){
  const card = document.getElementById("f-backup"); if(!card) return;
  let p = card.closest(".card").querySelector(".msgline");
  if(!p){ p = document.createElement("p"); p.setAttribute("role","status"); card.closest(".card").appendChild(p); }
  p.className = "msgline" + (backupMsg.bad ? " bad" : ""); p.textContent = backupMsg.t;
}

document.addEventListener("change", (e)=>{
  const el = e.target;
  if(el.dataset.tick != null){
    const i = +el.dataset.tick; if(!S.readings[i]) return;
    S.readings[i].done = el.checked ? isoOf(todayNum()) : "";
    save(); render(); return;
  }
  if(el.id === "f-place"){ ui.placeSel = +el.value; if(ui.confirm){ ui.confirm = null; render(); } return; }
  if(el.id === "t-per" || el.id === "t-months"){               // change your pace right from Today
    S.plan = normSpec(Object.assign({}, S.plan, el.id === "t-per" ? { perDay:+el.value } : { months:+el.value }));
    save(); render();
    if(P && P.finish != null) toast(S.plan.mode === "finish" ? cap(rateText(P.rate)) : "New finish date: " + fmt(P.finish, {year:true}));
    return; }
  if(/^m-(plan|mode|per|months)$/.test(el.id)){ ui.mSpec = specFromFields("m", ui.mSpec || S.plan); ui.confirm = null; render(); return; }
  if(el.id === "w-place"){ ui.wPlace = +el.value; render(); return; }
  if(/^w-(plan|mode|per|months|start)$/.test(el.id)){
    const st = document.getElementById("w-start").value; if(ISO.test(st)) S.start = st;
    const spec = specFromFields("w", S.plan);
    const rebuild = isFlexSpec(spec) !== isFlexSpec(S.plan) || planKey(spec) !== planKey(S.plan) || (!isFlexSpec(spec) && spec.pace !== S.plan.pace);
    S.plan = spec; if(rebuild){ S.readings = buildReadings(spec); ui.wPlace = 0; }
    render(); return;
  }
  const p = el.dataset.path; if(!p) return;
  if(p === "start"){ if(ISO.test(el.value) && el.value !== S.start){ S.start = el.value; save(); render(); toast("Start date changed"); } return; }
  needsRender = true; maybeRender();
});

document.addEventListener("input", (e)=>{
  const el = e.target, p = el.dataset.path;
  if(!p || el.type === "checkbox" || el.type === "date" || el.tagName === "SELECT") return;
  setP(p, el.value);
  if(p.indexOf("dayNotes.") === 0 && !el.value.trim()) delete S.dayNotes[p.slice(9)];
  save();
  needsRender = true;
});
document.addEventListener("focusout", maybeRender);

function fromHash(){
  const h = (location.hash||"").replace("#","");
  ui.tab = ["today","plan","notes","more"].includes(h) ? h : "today";
  ui.confirm = null;
  render();
  if(ui.tab === "today") centerChip();
  if(ui.tab === "plan" && !ui.planScrolled){ ui.planScrolled = true; setTimeout(()=>jumpToday(false), 0); }
}
window.addEventListener("hashchange", ()=>{ fromHash(); document.getElementById("main").scrollTop = 0; });

// a new day while the page stays open
let lastT = todayNum();
function checkDay(){ const t = todayNum(); if(t !== lastT){ lastT = t; ui.day = null; if(!isTyping()) render(); } }
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkDay(); });
setInterval(checkDay, 60000);

fromHash();
if(!S.tourSeen) setTimeout(startTour, 500);
setStatus("local");
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
})();
</script>
